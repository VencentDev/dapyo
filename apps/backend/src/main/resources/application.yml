spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt:
      secret: ${APP_AUTH_JWT_SECRET}
      issuer: ${APP_AUTH_JWT_ISSUER:dapyo-api}
      audience: ${APP_AUTH_JWT_AUDIENCE:dapyo-web}
      access-token-ttl: ${APP_AUTH_JWT_ACCESS_TOKEN_TTL:12h}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    auth:
      enabled: ${APP_RATE_LIMIT_AUTH_ENABLED:true}
      capacity: ${APP_RATE_LIMIT_AUTH_CAPACITY:60}
      refill-period: ${APP_RATE_LIMIT_AUTH_REFILL_PERIOD:1m}
  hikes:
    media-dir: ${APP_HIKES_MEDIA_DIR:${user.home}/.dapyo/hike-images}

management:
  endpoints:
    web:
      exposure:
        include: health,info
